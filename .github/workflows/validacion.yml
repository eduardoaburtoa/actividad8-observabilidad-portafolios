name: Validacion de observabilidad
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest pruebas -q
      - run: python scripts/verify_evidence.py
      - run: python scripts/run_lab.py
      - run: python scripts/verify_evidence.py
      - run: python scripts/figures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-ci
          path: |
            evidencias/*.json
            evidencias/*.jsonl
            evidencias/muestra_canario.csv
            evidencias/dashboard_mediciones.png
            evidencias/presupuesto_alertas.png
